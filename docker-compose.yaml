version: "3"

services:
  db:
    image: mariadb:10.6
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - try_gin_paragraph_layout

  app:
    depends_on:
      - db
    build:
      context: .
      dockerfile: ./.boing/docker/app/drupal/Dockerfile
      args:
        PHP_VERSION: 8.2
        GD_REQUIRE: 1
    volumes:
      - .:/srv
    networks:
      - try_gin_paragraph_layout

networks:
  try_gin_paragraph_layout:
    external: true

volumes:
  db_data:
